prefix: "<dark_gray>[<aqua>viClaimFly</aqua>]</dark_gray> "
no-permission: "<prefix><red>You do not have permission to do that.</red>"
player-only: "<prefix><red>This command can only be used by a player.</red>"
outside-claim: "<prefix><red>You are outside an eligible claim.</red>"
restricted-game-mode: "<prefix><red>Claim flight is unavailable in your current game mode.</red>"
flight-on: "<prefix><green>Claim flight enabled.</green>"
flight-off: "<prefix><gray>Claim flight disabled.</gray>"
auto-flight-on: "<prefix><green>Auto claim flight enabled.</green>"
auto-flight-off: "<prefix><gray>Auto claim flight disabled.</gray>"
cooldown: "<prefix><red>Wait <seconds> second(s) before enabling claim flight again.</red>"
warmup-started: "<prefix><yellow>Claim flight will enable in <seconds> second(s). Do not move.</yellow>"
warmup-pending: "<prefix><yellow>Claim flight warmup: <seconds> second(s).</yellow>"
warmup-cancelled: "<prefix><red>Claim flight warmup cancelled.</red>"
warmup-failed: "<prefix><red>Claim flight could not be enabled because you are no longer eligible.</red>"
combat-disabled: "<prefix><red>Claim flight was disabled because you entered combat.</red>"
admin-toggled: "<prefix><green>Toggled claim flight for <player>.</green>"
player-not-found: "<prefix><red>That player is not online.</red>"
status-on: "<prefix><green>Claim flight is ON.</green>"
status-off: "<prefix><gray>Claim flight is OFF.</gray>"
reload-success: "<prefix><green>Configuration reloaded. <providers> provider(s) active.</green>"
reload-failed: "<prefix><red>Reload failed; the previous configuration is still active. Check the console.</red>"

placeholders:
  on: "On"
  off: "Off"
  warming-up: "Warmup"
